<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=320">
    <title>Redireccionador</title>
</head>
<body>
    <h1>Redireccionador 3DS</h1>
    <input type="text" id="id" placeholder="Escribe ID" style="width:90%;padding:10px;font-size:18px;">
    <br><br>
    <button onclick="ir()" style="padding:10px 20px;font-size:18px;">Ir</button>

    <script>
        function ir() {
            let id = document.getElementById("id").value.trim();
            if (id) {
                window.location.href = "viewer.html?id=" + id;
            }
        }
    </script>
</body>
</html>
